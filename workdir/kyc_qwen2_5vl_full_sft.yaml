### model
model_name_or_path: /dev/shm/Qwen2.5-VL-72B-Instruct # /dev/shm/Qwen2.5-VL-72B-Instruct/Qwen/Qwen2.5-VL-72B-Instruct 
image_max_pixels: 4194304
image_min_pixels: 4096
video_max_pixels: 16384
trust_remote_code: true

### method
stage: sft
do_train: true
finetuning_type: full
freeze_vision_tower: false
freeze_multi_modal_projector: false
freeze_language_model: false
deepspeed: ../examples/deepspeed/ds_z3_config.json

### dataset
dataset: train # mllm_demo,identity,alpaca_en_demo
dataset_dir: /mnt/data/data
template: qwen2_vl
cutoff_len: 6144
max_samples: 1000000
overwrite_cache: false
cache_dir: /dev/shm/data_cache
preprocessing_batch_size: 512
preprocessing_num_workers: 16
dataloader_num_workers: 8

### output
output_dir: ./checkpoint/KYC-Qwen2.5-VL-72B-Instruct
logging_steps: 1
save_steps: 10000
plot_loss: false
overwrite_output_dir: true
save_only_model: true
report_to: wandb  # choices: [none, wandb, tensorboard, swanlab, mlflow]
run_name: kyc_6_class_bs32_1e-6_1029_data_trans_4_52_maxsize_12845056_6144_full_train_with_visionlr_2e-7_decay_1e-4

### train
per_device_train_batch_size: 2
gradient_accumulation_steps: 1
learning_rate: 1.0e-6
weight_decay: 0
lr_specific:
  - [2.0e-7, 0.0001, visual.blocks]
  - [2.0e-7, 0.0001, visual.patch_embed]
num_train_epochs: 1.0
lr_scheduler_type: cosine
warmup_ratio: 0.03
max_grad_norm: 1
bf16: true
ddp_timeout: 180000000
resume_from_checkpoint: null  # /mnt/data/checkpoint/Qwen2.5-VL-72B-Instruct/checkpoint-500
train_from_scratch: false # load from config
flash_attn: fa2
save_total_limit: 1
max_steps: -1
