### model
model_name_or_path: model_qwenvl_72b # /dev/shm/Qwen2.5-VL-72B-Instruct/Qwen/Qwen2.5-VL-72B-Instruct 
image_max_pixels: 262144
video_max_pixels: 16384
trust_remote_code: true

### method
stage: sft
do_train: true
finetuning_type: full
freeze_vision_tower: true
freeze_multi_modal_projector: true
freeze_language_model: false
deepspeed: /mnt/workspace/LLaMA-Factory/examples/deepspeed/ds_z3_config.json

### dataset
dataset: train # mllm_demo,identity,alpaca_en_demo
dataset_dir: /mnt/workspace/LLaMA-Factory/data
template: qwen2_vl
cutoff_len: 2048
max_samples: 10000
overwrite_cache: true
preprocessing_num_workers: 16
dataloader_num_workers: 4

### output
output_dir: /dev/shm/checkpoint/Qwen2.5-VL-72B-Instruct
logging_steps: 5
save_steps: 500
plot_loss: true
overwrite_output_dir: true
save_only_model: true
report_to: none  # choices: [none, wandb, tensorboard, swanlab, mlflow]

### train
per_device_train_batch_size: 1
gradient_accumulation_steps: 1
learning_rate: 1.0e-5
num_train_epochs: 10.0
lr_scheduler_type: cosine
warmup_ratio: 0.1
bf16: true
ddp_timeout: 180000000
resume_from_checkpoint: null
train_from_scratch: true # load from config
